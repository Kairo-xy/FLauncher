name: Build FLauncher APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Build Release APK (Unsigned)
        run: gradle assembleRelease --stacktrace

      - name: Rename APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/FLauncher-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/FLauncher-release-unsigned.apk || true

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FLauncher-Debug-APK
          path: dist/FLauncher-debug.apk
          retention-days: 30

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FLauncher-Release-APK
          path: dist/FLauncher-release-unsigned.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FLauncher-debug.apk
            dist/FLauncher-release-unsigned.apk
          generate_release_notes: true
          
