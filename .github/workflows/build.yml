name: Build FLauncher APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode signing keystore
        id: decode_keystore
        shell: bash
        env:
          RELEASE_KEY_BASE64: ${{ secrets.RELEASE_KEY_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          if [[ -n "${RELEASE_KEY_BASE64:-}" && -n "${RELEASE_STORE_PASSWORD:-}" && -n "${RELEASE_KEY_ALIAS:-}" && -n "${RELEASE_KEY_PASSWORD:-}" ]]; then
            echo "Decoding release signing keystore..."
            printf '%s' "$RELEASE_KEY_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            chmod 600 "$KEYSTORE_PATH"
            # Verify alias exists in keystore
            keytool -list -keystore "$KEYSTORE_PATH" -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" >/dev/null
            echo "RELEASE_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "has_signing_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Signing secrets not set. Building the debug APK only."
            echo "has_signing_key=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Build Release APK
        if: steps.decode_keystore.outputs.has_signing_key == 'true'
        run: gradle assembleRelease --stacktrace

      - name: Verify Release APK Signature
        if: steps.decode_keystore.outputs.has_signing_key == 'true'
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_APK="$(find app/build/outputs/apk/release -type f -name 'app-release.apk' | head -n 1)"
          if [[ -z "$RELEASE_APK" ]]; then
            echo "::error::Signed release APK not found at app/build/outputs/apk/release/app-release.apk"
            exit 1
          fi
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          echo "Verifying signature with $BUILD_TOOLS/apksigner..."
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$RELEASE_APK"
          echo "Release APK verified successfully!"

      - name: Prepare APK Artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/FLauncher-debug.apk
          if [[ -f app/build/outputs/apk/release/app-release.apk ]]; then
            cp app/build/outputs/apk/release/app-release.apk dist/FLauncher-release.apk
          fi

      - name: Clean up Keystore
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/release.jks" ]]; then
            shred -u "$RUNNER_TEMP/release.jks" 2>/dev/null || rm -f "$RUNNER_TEMP/release.jks"
            echo "Keystore cleaned up."
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FLauncher-debug.apk
          path: dist/FLauncher-debug.apk
          retention-days: 30

      - name: Upload Release APK Artifact
        if: steps.decode_keystore.outputs.has_signing_key == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FLauncher-release.apk
          path: dist/FLauncher-release.apk
          retention-days: 30

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
